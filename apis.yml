name: StarOfService
description: StarOfService is an online local-services marketplace that connects consumers with
  vetted service professionals across home improvement, events, wellness, lessons, and business
  services. Headquartered in France and operating across multiple European markets, the platform
  matches customer project requests to nearby providers and facilitates quotes and messaging between
  them. Surfaced as a portfolio company of Point Nine and profiled in the API Evangelist network;
  the company exposes a consumer web marketplace and has no public developer API surface at this time.
